# Netlify configuration file

[build]
  publish = "."

[build.processing]
  # Enable pretty URLs (e.g. /about instead of /about.html)
  [build.processing.html]
    pretty_urls = true

# Direct all non-existent paths to the custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Safety net: Block direct access to any PHP files or database configs
[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404

# Standard security and optimization headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy to secure the site while permitting standard CDN and iframe assets
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https:;"
